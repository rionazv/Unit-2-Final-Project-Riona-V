spring.application.name=Unit-2-Final-Project

## Import env file
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/unit-2-final-project?allowPublicKeyRetrieval=true&useSSL=false

spring.datasource.username=root

## Use environment variable for password
spring.datasource.password=${DB_PASS}

## Change update to create-drop for testing purposes, but this will delete all data on restart
spring.jpa.hibernate.ddl-auto=update

## Enable to true if Spring Boot blows up
debug=false